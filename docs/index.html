<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Native Guild</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
  </head>
  <body>
    <div id="app">加载中...</div>
    <script>
      window.$docsify = {
        name: 'Cloud Native Guild',
        repo: 'kiritosuki/cloud-native-guild',
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        search: {
          placeholder: '搜索笔记',
          noData: '没有找到结果',
          depth: 4
        }
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  </body>
